<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8dce0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
  <title>A little something for you</title>
  <style>
    :root { color-scheme: light; font-family: Georgia, 'Times New Roman', serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; color: #542d35; background: #f8dce0; }
    .scene { min-height: 100svh; position: relative; overflow: hidden; background: linear-gradient(90deg, rgba(255,239,238,.5), transparent 67%), url('content%20for%20project/Blush%20Bouquet%20and%20Sweet%20Cat.png') center / cover no-repeat; }
    .message-reveal { position: absolute; left: clamp(28px, 5vw, 78px); top: 50%; width: clamp(230px, 27vw, 370px); min-height: 230px; transform: translateY(-50%); display: grid; place-items: center; padding: 18px; border: 0; background: transparent; color: #842344; text-align: left; cursor: pointer; }
    .message-reveal:focus-visible { outline: 2px solid #842344; outline-offset: 3px; border-radius: 8px; }
    .reveal-hint { position: absolute; color: #a84966; font: 42px/1 Georgia, serif; opacity: .78; transition: opacity .25s, transform .35s; }
    .reveal-copy { opacity: 0; transform: translateY(12px) scale(.97); transition: opacity .3s, transform .35s; text-shadow: 0 2px 0 rgba(255,246,244,.9), 0 0 15px rgba(255,246,244,.95); pointer-events: none; }
    .reveal-copy > span { display: block; margin: 0 0 8px; font: 700 12px/1.4 Arial, sans-serif; letter-spacing: .16em; text-transform: uppercase; }
    .reveal-copy strong { display: block; color: #842344; font: 400 clamp(38px, 5vw, 62px)/.98 'Chewy', Georgia, serif; }
    .reveal-copy small { display: block; margin-top: 12px; color: #67283d; font: 700 15px/1.4 Arial, sans-serif; }
    .message-reveal:hover .reveal-copy, .message-reveal:focus-visible .reveal-copy, .message-reveal.revealed .reveal-copy { opacity: 1; transform: translateY(0) scale(1); }
    .message-reveal:hover .reveal-hint, .message-reveal:focus-visible .reveal-hint, .message-reveal.revealed .reveal-hint { opacity: 0; transform: scale(.6); }
    .controls { position: fixed; left: clamp(16px, 3vw, 38px); bottom: clamp(16px, 3vw, 34px); display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 1px solid rgba(141,73,84,.16); border-radius: 999px; background: rgba(255,249,247,.88); box-shadow: 0 8px 28px rgba(91,45,54,.12); backdrop-filter: blur(8px); font: 13px Arial, sans-serif; }
    button { color: inherit; font: inherit; cursor: pointer; }
    .music-toggle, .egg { border: 0; background: transparent; }
    .music-toggle { display: flex; align-items: center; gap: 7px; padding: 4px 2px; color: #6e3c46; }
    .music-toggle span:first-child { font-size: 16px; }
    .volume { width: 76px; accent-color: #b66b78; }
    .egg { position: fixed; right: clamp(18px, 3vw, 38px); bottom: clamp(20px, 3vw, 36px); width: 40px; height: 40px; border: 1px solid rgba(141,73,84,.22); border-radius: 50%; background: rgba(255,249,247,.82); color: #a75d6b; font-size: 20px; transition: transform .2s, background .2s; }
    .egg:hover { transform: rotate(-12deg) scale(1.08); background: white; }
    .signature { position: fixed; right: clamp(68px, 7vw, 94px); bottom: clamp(28px, 4vw, 45px); color: #ffffff; font: italic 13px Arial, sans-serif; }
    .modal { position: fixed; inset: 0; display: grid; place-items: center; padding: 22px; background: rgba(58,31,38,.62); backdrop-filter: blur(5px); opacity: 0; visibility: hidden; transition: opacity .2s, visibility .2s; z-index: 5; }
    .modal.open { opacity: 1; visibility: visible; }
    .video-card { position: relative; width: min(440px, 92vw); padding: 12px; border-radius: 19px; background: #fff8f6; box-shadow: 0 20px 70px rgba(20,9,12,.3); }
    .video-card video { display: block; width: 100%; max-height: 76svh; border-radius: 12px; background: #ead6d7; }
    .close { position: absolute; z-index: 1; top: 17px; right: 17px; width: 34px; height: 34px; border: 0; border-radius: 50%; background: rgba(255,248,246,.94); color: #633842; font-size: 21px; line-height: 1; }
    .caption { margin: 10px 2px 1px; color: #80565c; text-align: center; font-size: 15px; }
    @media (max-width: 650px) {
      .scene { background-position: 58% center; }
      .message-reveal { left: 16px; top: 34%; width: min(55vw, 275px); min-height: 185px; padding: 10px; }
      .reveal-copy strong { font-size: clamp(36px, 9vw, 48px); }
      .reveal-copy small { font-size: 13px; }
      .controls { gap: 9px; padding: 9px 12px; }
      .volume { width: 62px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="scene">
    <button class="message-reveal" id="messageReveal" type="button" aria-label="Reveal a little note" aria-expanded="false">
      <span class="reveal-hint" aria-hidden="true">♡</span>
      <span class="reveal-copy" aria-hidden="true">
        <span>just because</span>
        <strong>I made an entire page<br>like an idiot♡</strong>
        <small>Hope this makes you smile ♡</small>
      </span>
    </button>
  </main>

  <div class="controls" aria-label="Music controls">
    <button class="music-toggle" id="musicToggle" type="button" aria-label="Play music">
      <span aria-hidden="true">♫</span><span id="musicLabel">Play music</span>
    </button>
    <input class="volume" id="volume" type="range" min="0" max="1" step="0.01" value="0.55" aria-label="Music volume">
    <button class="music-toggle" id="muteToggle" type="button" aria-label="Mute music">Mute</button>
  </div>
  <audio id="song" loop preload="metadata" src="content%20for%20project/beabadoobee%20-%20Glue%20Song%20(Instrumental)%20-%20(320%20Kbps).mp3"></audio>

  <span class="signature">made by glitchy only for u</span>
  <button class="egg" id="egg" type="button" aria-label="A tiny surprise" title="A tiny surprise">♡</button>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="A little surprise">
    <div class="video-card">
      <button class="close" id="close" type="button" aria-label="Close">×</button>
      <video id="kissVideo" controls playsinline preload="metadata" src="content%20for%20project/can%20i%20get%20a%20kiss.mp4"></video>
      <p class="caption">okay… can i get a kiss? ♡</p>
    </div>
  </div>
  <script>
    const song = document.getElementById('song');
    const playButton = document.getElementById('musicToggle');
    const musicLabel = document.getElementById('musicLabel');
    const volume = document.getElementById('volume');
    const muteButton = document.getElementById('muteToggle');
    const modal = document.getElementById('modal');
    const video = document.getElementById('kissVideo');
    const egg = document.getElementById('egg');
    const closeButton = document.getElementById('close');
    const messageReveal = document.getElementById('messageReveal');

    messageReveal.addEventListener('click', () => {
      const revealed = messageReveal.classList.toggle('revealed');
      messageReveal.setAttribute('aria-expanded', String(revealed));
    });

    song.volume = Number(volume.value);
    function syncMusic() {
      const playing = !song.paused;
      musicLabel.textContent = playing ? 'Pause music' : 'Play music';
      playButton.setAttribute('aria-label', playing ? 'Pause music' : 'Play music');
      muteButton.textContent = song.muted || song.volume === 0 ? 'Unmute' : 'Mute';
      muteButton.setAttribute('aria-label', song.muted || song.volume === 0 ? 'Unmute music' : 'Mute music');
    }
    playButton.addEventListener('click', async () => {
      if (song.paused) { try { await song.play(); } catch {} } else song.pause();
      syncMusic();
    });
    song.addEventListener('play', syncMusic);
    song.addEventListener('pause', syncMusic);
    volume.addEventListener('input', () => { song.volume = Number(volume.value); if (song.volume > 0) song.muted = false; syncMusic(); });
    muteButton.addEventListener('click', () => { song.muted = !song.muted; syncMusic(); });

    function openSurprise() {
      modal.classList.add('open');
      video.volume = 1;
      video.muted = false;
      video.currentTime = 0;
      video.play().catch(() => {});
      closeButton.focus();
    }
    function closeSurprise() {
      video.pause();
      modal.classList.remove('open');
      egg.focus();
    }
    egg.addEventListener('click', openSurprise);
    closeButton.addEventListener('click', closeSurprise);
    modal.addEventListener('click', event => { if (event.target === modal) closeSurprise(); });
    document.addEventListener('keydown', event => { if (event.key === 'Escape' && modal.classList.contains('open')) closeSurprise(); });
  </script>
</body>
</html>
